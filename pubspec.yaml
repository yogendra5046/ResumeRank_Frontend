name: resume_ai
description: ATS Resume Analyzer
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  file_picker: ^8.1.1
  percent_indicator: ^4.2.3
  lottie: ^2.7.0
  glass_kit: ^4.0.2
  fl_chart: ^0.66.2
  pdf: ^3.10.4
  share_plus: ^7.2.1
  path_provider: ^2.1.0
  shimmer: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.1.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  csv: ^5.0.2
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  intl: ^0.19.0
  url_launcher: ^6.3.2
  flutter_markdown: ^0.7.7+1
  get_it: ^7.7.0
  flutter_bloc: ^8.1.5
  flutter_secure_storage: ^9.0.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mocktail: ^1.0.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lottie/
    - assets/app_icon.png